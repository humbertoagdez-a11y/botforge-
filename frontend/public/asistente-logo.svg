<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-label="Asistente BotForge">
  <defs>
    <linearGradient id="alBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232342"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <filter id="alGlowRed" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="alGlowBlue" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes al-blink { 0%, 93%, 100% { transform: scaleY(1); } 95%, 97% { transform: scaleY(0.12); } }
      @keyframes al-glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
      @keyframes al-antenna { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes al-eyecolor { 0%, 100% { fill: #22D3EE; } 50% { fill: #7C3AED; } }
      .al-eyes { animation: al-blink 4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .al-glow { animation: al-glow 2.6s ease-in-out infinite; }
      .al-cycle { animation: al-eyecolor 3s ease-in-out infinite; }
      .al-tip { animation: al-antenna 1.8s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .al-eyes, .al-glow, .al-cycle, .al-tip { animation: none; }
      }
    </style>
  </defs>

  <!-- Antena -->
  <line x1="32" y1="10" x2="32" y2="5" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="4" r="2.4" fill="#22D3EE" class="al-tip"/>

  <!-- Cabeza hexagonal -->
  <path d="M32 8 L52 18 L52 44 L32 58 L12 44 L12 18 Z" fill="url(#alBody)" stroke="#7C3AED" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M32 12 L48.5 20.2 L48.5 42 L32 53.5 L15.5 42 L15.5 20.2 Z" fill="none" stroke="#22D3EE" stroke-opacity="0.28" stroke-width="1"/>

  <!-- Ojos LED -->
  <g class="al-eyes">
    <rect x="20" y="26" width="9" height="6" rx="1.5" fill="#22D3EE" filter="url(#alGlowRed)" class="al-cycle"/>
    <rect x="35" y="26" width="9" height="6" rx="1.5" fill="#22D3EE" filter="url(#alGlowBlue)" class="al-cycle" style="animation-delay: 0.4s"/>
  </g>

  <!-- Boca / rejilla -->
  <g stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <line x1="26" y1="42" x2="38" y2="42"/>
    <line x1="28.5" y1="45.5" x2="35.5" y2="45.5"/>
  </g>

  <!-- Circuitos en las mejillas -->
  <g stroke="#7C3AED" stroke-width="1.2" stroke-linecap="round" opacity="0.8">
    <path d="M16 30 h3 v4 h2"/>
    <circle cx="22" cy="34" r="1" fill="#7C3AED" stroke="none"/>
    <path d="M48 30 h-3 v4 h-2"/>
    <circle cx="42" cy="34" r="1" fill="#7C3AED" stroke="none"/>
  </g>

  <!-- Tornillos laterales -->
  <circle cx="12" cy="31" r="1.6" fill="#22D3EE" opacity="0.7"/>
  <circle cx="52" cy="31" r="1.6" fill="#22D3EE" opacity="0.7"/>
</svg>
