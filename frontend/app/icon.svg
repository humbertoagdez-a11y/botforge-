<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Favicon BotForge: cara del robot como tile solido, optimizado para 16px.
       Tile con gradiente (contrasta sobre pestanas claras y oscuras) + ojos
       cian gruesos + punto de antena. Sin trazos finos ni boca (ruido a 16px). -->
  <defs>
    <linearGradient id="bf-tile" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <!-- Tile solido de fondo -->
  <rect width="32" height="32" rx="8" fill="url(#bf-tile)"/>
  <!-- Punto de antena -->
  <circle cx="16" cy="6.5" r="2.1" fill="#22D3EE"/>
  <!-- Ojos rectangulares cian, gruesos y bien separados -->
  <rect x="8" y="12" width="6.5" height="10" rx="2.5" fill="#22D3EE"/>
  <rect x="17.5" y="12" width="6.5" height="10" rx="2.5" fill="#22D3EE"/>
</svg>
